[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asca"
version = "0.1.0"
description = "ASCA — Adaptive Sparse Cognitive Architecture: riset arsitektur LLM dari nol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []          # torch disediakan venv bersama (~/.venvs/ml)

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.20"]
hf = ["datasets>=3.0", "huggingface_hub>=0.25"]
dev = ["tokenizers>=0.20"]

[tool.setuptools]
packages = ["asca", "baseline", "data", "benchmarks"]

# LSP: torch berada di venv bersama, bukan di environment proyek.
[tool.pyright]
extraPaths = ["/home/asephs/.venvs/ml/lib/python3.13/site-packages"]
reportMissingImports = "none"
reportArgumentType = "none"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
